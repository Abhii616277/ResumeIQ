<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Animated Background</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-1: #ff6b6b;
            --color-2: #4ecdc4;
            --color-3: #ffe66d;
            --color-4: #a8dadc;
            --color-5: #ff8fab;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Gradient Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, 
                var(--color-1) 0%, 
                var(--color-2) 25%, 
                var(--color-3) 50%, 
                var(--color-4) 75%, 
                var(--color-5) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.8), transparent);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(78, 205, 196, 0.8), transparent);
            top: 50%;
            right: -5%;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 230, 109, 0.7), transparent);
            bottom: -20%;
            left: 30%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -80px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 60px) scale(0.9);
            }
        }

        /* Geometric Pattern Overlay */
        .pattern-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.05) 35px, rgba(255,255,255,.05) 70px);
            opacity: 0.3;
        }

        /* Animated Particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Generate particles with varied timing */
        .particle:nth-child(1) { left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-duration: 12s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-duration: 10s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-duration: 14s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 50%; animation-duration: 11s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 60%; animation-duration: 9s; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; animation-duration: 13s; animation-delay: 2.5s; }
        .particle:nth-child(8) { left: 80%; animation-duration: 10s; animation-delay: 4.5s; }
        .particle:nth-child(9) { left: 90%; animation-duration: 12s; animation-delay: 1.5s; }
        .particle:nth-child(10) { left: 15%; animation-duration: 11s; animation-delay: 3.5s; }

        /* Glass Morphism Content Card */
        .content-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 80px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: -1px;
        }

        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.8;
            font-weight: 300;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .glass-card {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }

            .orb-1, .orb-2, .orb-3 {
                width: 300px;
                height: 300px;
            }
            /* Buttons */
.cta-button,
.about-button {
    display: inline-block;
    margin: 15px 10px 0 10px;
    padding: 12px 28px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 500;
    font-size: 1rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: white;
    background: rgba(255, 255, 255, 0.2);
}

.cta-button:hover,
.about-button:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.35);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}

        }
    </style>
</head>
<body>
    <!-- Animated Background Layer -->
    <div class="background"></div>
    
    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    
    <!-- Pattern Overlay -->
    <div class="pattern-overlay"></div>
    
    <!-- Animated Particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    
    <!-- Content -->
    <div class="content-container">
        <div class="glass-card">
            <h1>Welcome to the Resume Screener</h1>
      <h3>"Automated resume screening based on job profiles. Easily find the best candidates for your open roles!"</h3>
        <section class="hero">
            <div class="hero-content">
                <h1>Elevate Your Career with a Resume That Stands Out!</h1>
                <p>Instantly evaluate, rank, and improve your resume with our AI-powered tool.</p>
                <a href="/resume_upload" class="cta-button">Get Started</a>
            </div>
          </section>
          <a href="/about_us" class="about-button">About Us</a>

        </div>
    </div>

</body>
</html>
